  <text x="89" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6366F1" letter-spacing="2">GLOBAL PLATFORM</text>
