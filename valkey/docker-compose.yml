name: nextturn-cache

services:
  valkey:
    container_name: nextturn-valkey
    image: valkey/valkey:${VALKEY_IMAGE_TAG:-8.0-alpine}
    restart: unless-stopped
    # Khởi chạy trực tiếp: Bật AOF để bảo vệ Queue, cấu hình mật khẩu nếu có
    command: >-
      sh -c 'if [ -n "$$VALKEY_PASSWORD" ]; then
        exec valkey-server --appendonly yes --requirepass "$$VALKEY_PASSWORD"
      else
        exec valkey-server --appendonly yes
      fi'
    env_file:
      - .env
    volumes:
      # Persistent cache & AOF/RDB queue storage
      - valkey_data:/data:Z
    # Chỉ mở ra localhost của máy host nếu cần debug; bỏ qua nếu chỉ chạy trong container network
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    networks:
      - nextturn-network
    healthcheck:
      test: >-
        sh -c 'if [ -n "$$VALKEY_PASSWORD" ]; then
          valkey-cli --no-auth-warning -a "$$VALKEY_PASSWORD" ping | grep -q PONG
        else
          valkey-cli ping | grep -q PONG
        fi'
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  valkey_data:
    name: nextturn_valkey_data
    driver: local

networks:
  nextturn-network:
    name: nextturn-network
    external: true